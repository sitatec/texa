name: texa
description: "The personal AI tutor for everyone"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  dart_openai: ^8.0.0
  flutter_drawing_board: ^1.0.1+2
  flutter_quick_video_encoder: ^1.7.2
  flutter_svg: ^2.3.0
  tostore: ^3.6.0
  math_expressions: ^3.2.0
  flutter_math_fork: ^0.7.4
  sherpa_onnx: ^2.0.1
  record: ^7.1.2
  audio_session: ^0.2.4
  just_audio: ^0.10.6
  archive: ^4.5.2
  slang: ^4.19.2
  slang_flutter: ^4.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.6.0


flutter:
  uses-material-design: true

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-SemiBold.ttf
          weight: 600
