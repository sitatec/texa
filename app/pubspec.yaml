name: texa
description: "The personal AI tutor for everyone"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dart_openai: ^8.0.0
  flutter_quick_video_encoder: ^1.7.2
  flutter_secure_storage: ^11.2.0
  web: ^1.1.2
  flutter_svg: ^2.3.0
  tostore: ^3.6.0
  math_expressions: ^3.2.0
  flutter_math_fork: ^0.7.4
  flutter_recorder: ^2.0.6
  just_audio: ^0.10.6
  http: ^1.6.0
  path_provider: ^2.1.5
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  wakelock_plus: ^1.8.2
  mime: ^2.1.0
  file_picker: ^13.3.0
  waveform_flutter: ^1.2.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  logging: ^1.3.0
  cross_file: ^0.3.5+5
  material_symbols_icons: ^4.2951.0
  chewie: ^1.17.4
  video_player: ^2.14.0
  flutter_native_splash: ^2.4.8
  sherpa_onnx:
    path: ./sherpa-onnx/flutter/sherpa_onnx

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.6.0
  build_runner: ^2.11.0
  flutter_launcher_icons: "^0.14.4"

dependency_overrides:
  sherpa_onnx_android_arm64:
    path: ./sherpa-onnx/flutter/sherpa_onnx_android_arm64
  sherpa_onnx_android_armeabi:
    path: ./sherpa-onnx/flutter/sherpa_onnx_android_armeabi
  sherpa_onnx_android_x86_64:
    path: ./sherpa-onnx/flutter/sherpa_onnx_android_x86_64
  sherpa_onnx_android_x86:
    path: ./sherpa-onnx/flutter/sherpa_onnx_android_x86
  sherpa_onnx_ios:
    path: ./sherpa-onnx/flutter/sherpa_onnx_ios
  sherpa_onnx_macos:
    path: ./sherpa-onnx/flutter/sherpa_onnx_macos
  sherpa_onnx_web:
    path: ./sherpa-onnx/flutter/sherpa_onnx_web
  sherpa_onnx_windows:
    path: ./sherpa-onnx/flutter/sherpa_onnx_windows
  sherpa_onnx_linux:
    path: ./sherpa-onnx/flutter/sherpa_onnx_linux

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#f5f5f5"
  image_path: "../branding/logo.png"
  adaptive_icon_foreground: "../branding/logo-transparent.png"
  web:
    generate: true
    background_color: "#f5f5f5"
    image_path: "../branding/logo.png"
    theme_color: "#3B82F6"
  macos:
    generate: true
    image_path: "../branding/logo.png"
  windows:
    generate: true
    image_path: "../branding/logo.png"
    icon_size: 96

flutter_native_splash:
  color: "#f5f5f5"
  color_dark: "#f5f5f5"
  image: "../branding/splash-logo.png"
  image_dark: "../branding/splash-logo.png"
  fullscreen: true
  
  android: true
  ios: true
  web: false # We handle web manually to support animation

  android_12:
    image: "../branding/splash-logo.png"
    color: "#f5f5f5"
    image_dark: "../branding/splash-logo.png"
    color_dark: "#f5f5f5"