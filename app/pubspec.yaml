name: texa
description: "The personal AI tutor for everyone"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dart_openai: ^8.0.0
  flutter_quick_video_encoder: ^1.7.2
  flutter_secure_storage: ^11.2.0
  web: ^1.1.2
  flutter_svg: ^2.3.0
  tostore: ^3.6.0
  math_expressions: ^3.2.0
  flutter_math_fork: ^0.7.4
  sherpa_onnx: ^2.0.1
  record: ^7.1.2
  audio_session: ^0.2.4
  just_audio: ^0.10.6
  http: ^1.6.0
  path_provider: ^2.1.5
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  wakelock_plus: ^1.8.2
  mime: ^2.1.0
  file_picker: ^13.3.0
  waveform_flutter: ^1.2.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  logging: ^1.3.0
  cross_file: ^0.3.5+5
  material_symbols_icons: ^4.2951.0
  chewie: ^1.17.4
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.6.0
  build_runner: ^2.11.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-SemiBold.ttf
          weight: 600
